<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Social Media</title>

    <!-- CSS Styling -->
        
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
            font-size: 18px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            background-color: #333;
            color: white;
            padding: 12px 25px;
            margin: 8px;
            border-radius: 5px;
        }

        a:hover {
            background-color: #555;
        }
    </style>
</head>

<!-- Body Content -->

<body>

    <h1>Welcome to My Website</h1>

    <p id="message">Connect with me on social media:</p>

    <a href="https://www.facebook.com/" target="_blank" onclick="showMessage('Facebook')">
        Facebook
    </a>

    <a href="https://www.instagram.com/" target="_blank" onclick="showMessage('Instagram')">
        Instagram
    </a>

    <a href="https://www.linkedin.com/" target="_blank" onclick="showMessage('LinkedIn')">
        LinkedIn
    </a>

    <a href="https://www.youtube.com/" target="_blank" onclick="showMessage('YouTube')">
        YouTube
    </a>

    <a href="https://x.com/" target="_blank" onclick="showMessage('X (Twitter)')">
        X (Twitter)
    </a>


    <!-- JavaScript -->
     
    <script>
        // Show a welcome message when the page loads
        window.onload = function() {
            alert("Welcome to My Social Media Website!");
        };

        // Function to show which social media button was clicked
        function showMessage(platform) {
            document.getElementById("message").innerHTML =
                "You clicked on " + platform + "!";
        }
    </script>

</body>
</html>
