
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dark Nexus Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, #25104a 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #063b46 0%, transparent 35%),
                #050508;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            overflow-x: hidden;
        }

        /* Background glow */
        body::before {
            content: "";
            position: fixed;
            width: 350px;
            height: 350px;
            background: #8b5cf6;
            filter: blur(180px);
            opacity: 0.15;
            top: -100px;
            left: -100px;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            width: 350px;
            height: 350px;
            background: #00e5ff;
            filter: blur(180px);
            opacity: 0.12;
            bottom: -100px;
            right: -100px;
            pointer-events: none;
        }

        .form-container {
            position: relative;
            width: 100%;
            max-width: 520px;
            padding: 2px;
            border-radius: 22px;
            background: linear-gradient(
                135deg,
                #8b5cf6,
                transparent 40%,
                #00e5ff
            );
        }

        form {
            background: rgba(8, 8, 14, 0.94);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 35px;
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.7),
                inset 0 0 30px rgba(255, 255, 255, 0.02);
        }

        .logo {
            width: 55px;
            height: 55px;
            margin: 0 auto 15px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
            font-weight: bold;
            background: linear-gradient(135deg, #8b5cf6, #00e5ff);
            color: #050508;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
        }

        h1 {
            text-align: center;
            margin: 0;
            font-size: 30px;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, #a5f3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin: 8px 0 30px;
            letter-spacing: 1px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #aaa;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 13px 15px;
            background: #0d0d14;
            border: 1px solid #292934;
            border-radius: 10px;
            color: #fff;
            outline: none;
            font-size: 14px;
            transition: 0.3s ease;
        }

        input::placeholder,
        textarea::placeholder {
            color: #555;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #00e5ff;
            box-shadow:
                0 0 0 3px rgba(0, 229, 255, 0.08),
                0 0 18px rgba(0, 229, 255, 0.12);
            background: #101018;
        }

        select {
            cursor: pointer;
        }

        select option {
            background: #0d0d14;
            color: white;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .plan-title {
            color: #aaa;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .plans {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .plans input {
            display: none;
        }

        .plans label {
            margin: 0;
            padding: 13px 8px;
            text-align: center;
            text-transform: none;
            letter-spacing: 0;
            font-size: 13px;
            font-weight: normal;
            color: #888;
            background: #0d0d14;
            border: 1px solid #292934;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .plans label:hover {
            border-color: #666;
            color: white;
        }

        .plans input:checked + label {
            color: #00e5ff;
            border-color: #00e5ff;
            background: rgba(0, 229, 255, 0.06);
            box-shadow: 0 0 18px rgba(0, 229, 255, 0.1);
        }

        .terms {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 5px 0 25px;
        }

        .terms input {
            width: 17px;
            height: 17px;
            accent-color: #00e5ff;
            cursor: pointer;
        }

        .terms label {
            margin: 0;
            font-size: 12px;
            color: #777;
            text-transform: none;
            letter-spacing: 0;
            cursor: pointer;
        }

        .terms label:hover {
            color: #aaa;
        }

        button {
            position: relative;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #8b5cf6, #00e5ff);
            color: #050508;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            overflow: hidden;
            transition: 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow:
                0 10px 30px rgba(0, 229, 255, 0.18),
                0 0 25px rgba(139, 92, 246, 0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            color: #444;
            font-size: 10px;
            letter-spacing: 1px;
        }

        @media (max-width: 500px) {
            form {
                padding: 25px 20px;
            }

            h1 {
                font-size: 25px;
            }

            .plans {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="form-container">

        <form action="save.php" method="post">

            <div class="logo">N</div>

            <h1>DARK NEXUS</h1>

            <div class="subtitle">
                CREATE YOUR DIGITAL IDENTITY
            </div>

            <!-- Name -->
            <div class="field">
                <label for="name">Name</label>
                <input
                    id="name"
                    name="name"
                    type="text"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <!-- Phone -->
            <div class="field">
                <label for="phone">Phone</label>
                <input
                    id="phone"
                    name="phone"
                    type="tel"
                    placeholder="Enter your phone number"
                    required
                >
            </div>

            <!-- Email -->
            <div class="field">
                <label for="email">Email</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <!-- Password -->
            <div class="field">
                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <!-- Date -->
            <div class="field">
                <label for="dob">Date of Birth</label>
                <input
                    id="dob"
                    name="dob"
                    type="date"
                    required
                >
            </div>

            <!-- Gender -->
            <div class="field">
                <label for="gender">Gender</label>

                <select id="gender" name="gender" required>
                    <option value="" disabled selected>
                        Select gender
                    </option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <!-- Subscription -->
            <div class="field">

                <div class="plan-title">
                    Subscription Plan
                </div>

                <div class="plans">

                    <input
                        id="basic"
                        type="radio"
                        name="subscription"
                        value="basic"
                        required
                    >
                    <label for="basic">Basic</label>

                    <input
                        id="premium"
                        type="radio"
                        name="subscription"
                        value="premium"
                    >
                    <label for="premium">Premium</label>

                    <input
                        id="vip"
                        type="radio"
                        name="subscription"
                        value="vip"
                    >
                    <label for="vip">VIP</label>

                </div>

            </div>

            <!-- Comments -->
            <div class="field">

                <label for="comments">
                    Message
                </label>

                <textarea
                    id="comments"
                    name="comments"
                    placeholder="Tell us something..."
                    rows="4"
                ></textarea>

            </div>

            <!-- Terms -->
            <div class="terms">

                <input
                    id="terms"
                    name="terms"
                    type="checkbox"
                    required
                >

                <label for="terms">
                    I agree to the terms and conditions
                </label>

            </div>

            <!-- Submit -->
            <button type="submit">
                ENTER THE NEXUS
            </button>

            <div class="footer">
                SECURE REGISTRATION • DARK NEXUS
            </div>

        </form>

    </div>

</body>
</html>
