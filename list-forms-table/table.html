<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Students Report</title>

    <style>

        /* Style the entire page */
        body 
        {

            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
        
        }

        /* Style the table */
        table
        {

            width: 60%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        
        }

        /* Style the table caption */
        caption
        {

            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        
        }

        /* Style table header */
        thead 
        {

            background-color: #007bff;
            color: white;
        
        }

        /* Style table cells */
        th,td 
        {

            padding: 15px;
            text-align: center;
            border: 1px solid #ddd;
        
        }

        /* Make table headings bold */
        th
        {

            font-size: 18px;
        
        }

        /* Style table rows */
        tbody tr:nth-child(even)
        {

            background-color: #f2f2f2;
        
        }

        /* Add hover effect */
        tbody tr:hover 
        {

            background-color: #dbeafe;
        
        }

        /* Style grade column */
        td:nth-child(2)
        {

            font-weight: bold;
        
        }

    </style>

</head>

<body>

    <table>

        <caption>Students Report</caption>

        <thead>

            <tr>

                <th>Name</th>
                <th>Grade</th>

            </tr>

        </thead>

        <tbody>

            <tr>

                <td>Rohan</td>
                <td>A+</td>

            </tr>

            <tr>

                <td>Harry</td>
                <td>D</td>

            </tr>

        </tbody>

    </table>

</body>

</html>
